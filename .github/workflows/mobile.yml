name: Zero Trust Mobile Build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'account.js'
      - 'account.css'
      - 'app.js'
      - 'styles.css'
      - 'tool-engine.js'
      - 'engines/**'
      - 'scripts/**'
      - 'data/**'
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package.json
      - name: Install Capacitor
        run: npm install
      - name: Build and sync web app
        env:
          ZT_APP_SERVER_URL: ${{ secrets.ZT_APP_SERVER_URL }}
        run: npm run sync
      - name: Add Android project
        run: npx cap add android
      - name: Sync Android
        run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android debug APK
        run: ./android/gradlew -p android assembleDebug --no-daemon
      - name: Build Android release bundle when signing is configured
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/zero-trust-release.keystore
          ./android/gradlew -p android bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: zero-trust-android
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Capacitor
        run: npm install
      - name: Build and sync web app
        env:
          ZT_APP_SERVER_URL: ${{ secrets.ZT_APP_SERVER_URL }}
        run: npm run sync
      - name: Add iOS project
        run: npx cap add ios
      - name: Sync iOS
        run: npx cap sync ios
      - name: Build iOS simulator app
        run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        with:
          name: zero-trust-ios-simulator
          path: mobile/build/Build/Products/Debug-iphonesimulator/App.app

name: Zero Trust Quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize generated tool runtimes
        run: |
          set -e
          sed -i 's/getRandomValues(new Uint8Array(3))];/getRandomValues(new Uint8Array(3))]);/g' engines/free/individual-tools.js engines/free/real-tools.js
      - name: JavaScript syntax
        run: |
          set -e
          find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './node_modules/*' -print0 | while IFS= read -r -d '' f; do node --check "$f"; done
      - name: Catalog integrity
        run: node --input-type=module -e "import { CATALOG,MODERN_TOOL_COUNT,LEGACY_TOOL_COUNT,LEGACY_NAMED_TOOL_COUNT,LEGACY_GENERATED_TOOL_COUNT } from './data/catalog-combined.mjs'; console.log('modern='+MODERN_TOOL_COUNT+' legacy='+LEGACY_TOOL_COUNT+' named='+LEGACY_NAMED_TOOL_COUNT+' generated='+LEGACY_GENERATED_TOOL_COUNT+' combined='+CATALOG.length); if(MODERN_TOOL_COUNT!==1009||LEGACY_TOOL_COUNT!==600||LEGACY_NAMED_TOOL_COUNT!==200||LEGACY_GENERATED_TOOL_COUNT!==400||CATALOG.length!==1594||new Set(CATALOG.map(x=>x.slug)).size!==CATALOG.length) process.exit(1)"
      - name: Tool capability audit
        run: node scripts/audit-tools.mjs
      - name: Exhaustive capability matrix
        run: |
          node scripts/build-capability-matrix.mjs
          node --input-type=module -e "import fs from 'node:fs'; const x=JSON.parse(fs.readFileSync('reports/tool-capability-matrix.json','utf8')); if(x.total!==1594||x.tools.length!==1594) process.exit(1); const allowed=new Set(['REAL_LOCAL','REAL_EXTERNAL','PARTIAL','UNSUPPORTED','DISABLED']); if(x.tools.some(t=>!allowed.has(t.status))) process.exit(1); console.log(JSON.stringify(x.counts,null,2));"
      - name: Build complete static site
        run: |
          set -e
          rm -rf dist; OUT_DIR=dist SITE_BASE=/ node scripts/build-pages.mjs
          cp styles.css tool-page.css app.js tool-engine.js account.js account.css owner.js manifest.json sw.js 404.html _headers _redirects dist/; cp -r engines assets dist/
          SITE_BASE=/ node scripts/merge-legacy-pages.mjs; OUT_DIR=dist SITE_BASE=/ node scripts/enhance-platform.mjs
          node scripts/optimize-tool-pages.mjs
          find dist/tools -name index.html -print0 | xargs -0 sed -i 's#</head>#<link rel="stylesheet" href="/tool-page.css">\n</head>#g'
          EXPECTED=$(node --input-type=module -e "import('./data/catalog-combined.mjs').then(({CATALOG})=>process.stdout.write(String(CATALOG.length)))" | tail -n 1)
          EXPECTED_CATEGORIES=$(node --input-type=module -e "import('./data/catalog.mjs').then(({CATALOG})=>process.stdout.write(String(new Set(CATALOG.map(x=>x.category)).size)))" | tail -n 1)
          TOOL_PAGES=$(find dist/tools -mindepth 2 -maxdepth 2 -type f -name index.html | wc -l)
          CATEGORY_PAGES=$(find dist/tools/category -mindepth 2 -maxdepth 2 -type f -name index.html | wc -l)
          echo "tool_pages=$TOOL_PAGES category_pages=$CATEGORY_PAGES expected_tools=$EXPECTED expected_categories=$EXPECTED_CATEGORIES"
          test "$TOOL_PAGES" -eq "$EXPECTED"
          test "$CATEGORY_PAGES" -eq "$EXPECTED_CATEGORIES"
      - name: Static page integrity
        run: |
          test -f dist/index.html; test -f dist/tools/index.html; test -f dist/styles.css; test -f dist/tool-page.css; test -f dist/tools/jpg-to-png-converter/index.html; test -f dist/tools/pdf-page-counter/index.html
          test -f dist/login/index.html; test -f dist/signup/index.html; test -f dist/account/index.html; test -f dist/owner/index.html; test -f dist/pricing/index.html
          grep -q 'data-tool-slug="jpg-to-png-converter"' dist/tools/jpg-to-png-converter/index.html; grep -q 'Quick answer' dist/tools/pdf-page-counter/index.html; grep -q 'applicationCategory' dist/tools/jpg-to-png-converter/index.html; grep -q 'tool-page.css' dist/tools/jpg-to-png-converter/index.html; grep -q 'Quick tools' dist/index.html; grep -q 'hamburger' dist/index.html; grep -q 'Continue with Google' dist/login/index.html
          node tests/page-quality.mjs
      - name: Security regression
        run: node tests/security-static.mjs
      - name: API account and entitlement smoke
        run: |
          npm install --no-save --no-package-lock wrangler@latest
          npx --yes wrangler@latest d1 execute zero-trust-ci --local --file=api/schema.sql --config=wrangler.ci.jsonc
          (npx --yes wrangler@latest dev --local --config=wrangler.ci.jsonc --port=8787 --var OWNER_EMAIL:owner-ci@example.invalid --var OWNER_BOOTSTRAP_SECRET:CiBootstrap-${GITHUB_RUN_ID}-LongEnough >/tmp/zt-worker.log 2>&1) &
          WORKER_PID=$!; trap 'kill $WORKER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:8787/api/health >/dev/null; then break; fi; if [ "$i" = 30 ]; then cat /tmp/zt-worker.log; exit 1; fi; sleep 1; done
          timeout 120s env API_BASE=http://127.0.0.1:8787 TEST_OWNER_EMAIL=owner-ci@example.invalid TEST_OWNER_PASSWORD="CiPass-${GITHUB_RUN_ID}-LongEnough" TEST_OWNER_BOOTSTRAP_SECRET="CiBootstrap-${GITHUB_RUN_ID}-LongEnough" TEST_USER_EMAIL=user-ci@example.invalid TEST_USER_PASSWORD="CiUser-${GITHUB_RUN_ID}-LongEnough" node tests/api-smoke.mjs
      - name: Complete 1,594-tool action regression
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright@1.55.0 install --with-deps chromium
          cat > /tmp/zt-server.py <<'PY'
          from http.server import SimpleHTTPRequestHandler,ThreadingHTTPServer
          ThreadingHTTPServer(('127.0.0.1',4173),SimpleHTTPRequestHandler).serve_forever()
          PY
          (cd dist && python3 /tmp/zt-server.py >/tmp/zt-server.log 2>&1) & SERVER_PID=$!; trap 'kill $SERVER_PID' EXIT
          BASE_URL=http://127.0.0.1:4173 node tests/tool-regression.mjs
          SITE_ROOT=dist node tests/smoke.mjs; SITE_ROOT=dist node tests/legacy-smoke.mjs
name: Zero Trust Quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check tool-engine.js
          node --check scripts/build-pages.mjs
          node --check engines/free/core.js
          node --check engines/free/pdf.js
          node --check engines/free/pdf-advanced.js
          node --check engines/free/image.js
          node --check engines/free/qr.js
          node --check engines/free/utility.js
          node --check engines/free/security.js
          node --check engines/free/generic.js
      - name: Required foundation files
        run: test -f index.html && test -f styles.css && test -f manifest.json && test -f sw.js && test -f robots.txt && test -f sitemap.xml && test -f _headers && test -f 404.html
      - name: Lazy engine boundary
        run: |
          test -f engines/paid/README.md
          ! grep -R "engines/paid" engines/free tool-engine.js
          ! grep -R "api\.domain\.com" . --exclude-dir=.git
      - name: Tool registry coverage
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import vm from 'node:vm'; const ctx={window:{},document:{addEventListener(){}}}; vm.runInNewContext(fs.readFileSync('app.js','utf8'),ctx); const n=ctx.window.ZT_TOOLS.length; console.log('tools='+n); if(n<500) process.exit(1)"
      - name: SEO page generator
        run: node scripts/build-pages.mjs
      - name: Normalize physical tool bootstraps
        run: |
          find tools -type f -name index.html -print0 | while IFS= read -r -d '' f; do
            sed -i -E 's#<script src="/Zero-trust/tool-engine\.js\?v=[^"]+" defer></script>#<script src="/Zero-trust/app.js?v=204" defer></script>#g' "$f"
          done
      - name: Tool engine coverage
        run: |
          test -f engines/free/generic.js
          test -f engines/free/security.js
          test -f engines/free/utility.js
          test -f engines/free/qr.js
          test -f engines/free/pdf-advanced.js
          grep -q "secure-random-generator" tool-engine.js
          grep -q "base64-decoder" tool-engine.js
          grep -q "wifi-qr-generator" tool-engine.js
          grep -q "pdf-advanced" tool-engine.js
      - name: Browser smoke test all registered routes
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright@1.55.0 install --with-deps chromium
          cat > /tmp/zt-server.py <<'PY'
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          from pathlib import Path
          class Handler(SimpleHTTPRequestHandler):
              def send_head(self):
                  path = self.translate_path(self.path)
                  p = Path(path)
                  if not p.is_file() and not (p.is_dir() and (p / 'index.html').is_file()):
                      self.path = '/Zero-trust/404.html'
                  return super().send_head()
          ThreadingHTTPServer(('127.0.0.1', 4173), Handler).serve_forever()
          PY
          (cd .. && python3 /tmp/zt-server.py >/tmp/zt-server.log 2>&1) &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          node tests/smoke.mjs
name: Zero Trust Quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check tool-engine.js
          node --check engines/free/core.js
          node --check engines/free/pdf.js
          node --check engines/free/image.js
          node --check engines/free/qr.js
          node --check engines/free/utility.js
      - name: Required foundation files
        run: test -f index.html && test -f styles.css && test -f manifest.json && test -f sw.js && test -f robots.txt && test -f sitemap.xml && test -f _headers
      - name: Lazy engine boundary
        run: |
          test -f engines/paid/README.md
          ! grep -R "engines/paid" engines/free tool-engine.js
          ! grep -R "api\.domain\.com" . --exclude-dir=.git
      - name: MVP routes
        run: |
          for p in pdf-merger pdf-compressor pdf-to-jpg jpg-to-pdf pdf-splitter image-compressor image-resizer image-cropper qr-generator qr-scanner password-generator json-formatter base64 hash-generator uuid-generator; do test -f "tools/$p/index.html"; done

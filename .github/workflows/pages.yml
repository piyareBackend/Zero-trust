name: Deploy Zero Trust
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize generated tool runtimes
        run: |
          set -e
          sed -i 's/getRandomValues(new Uint8Array(3))];/getRandomValues(new Uint8Array(3))]);/g' engines/free/individual-tools.js engines/free/real-tools.js
      - name: Build artifact
        run: |
          set -e
          rm -rf dist
          OUT_DIR=dist SITE_BASE=/Zero-trust/ node scripts/build-pages.mjs
          cp styles.css tool-page.css app.js tool-engine.js account.js account.css owner.js manifest.json sw.js 404.html _headers _redirects dist/
          cp -r engines assets dist/
          SITE_BASE=/Zero-trust/ node scripts/merge-legacy-pages.mjs
          OUT_DIR=dist SITE_BASE=/Zero-trust/ node scripts/enhance-platform.mjs
          OUT_DIR=dist SITE_BASE=/Zero-trust/ node scripts/optimize-tool-pages.mjs
      - name: Verify combined artifact
        run: |
          EXPECTED=$(node --input-type=module -e "import('./data/catalog-combined.mjs').then(({CATALOG})=>process.stdout.write(String(CATALOG.length)))" | tail -n 1)
          EXPECTED_CATEGORIES=$(node --input-type=module -e "import('./data/catalog-combined.mjs').then(({CATALOG})=>process.stdout.write(String(new Set(CATALOG.map(x=>x.category)).size)))" | tail -n 1)
          test "$(find dist/tools -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -eq "$EXPECTED"
          test "$(find dist/tools/category -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -eq "$EXPECTED_CATEGORIES"
          test -f dist/index.html; test -f dist/data/tools-index.json; test -f dist/tool-page.css
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy Pages
        uses: actions/deploy-pages@v4
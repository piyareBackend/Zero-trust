name: Deploy Zero Trust
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
  pages: write
  id-token: write
concurrency:
  group: zero-trust-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://piyarebackend.github.io/Zero-trust/
    env:
      CF_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      OWNER_BOOTSTRAP_SECRET: ${{ secrets.OWNER_BOOTSTRAP_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Cloudflare artifact
        if: env.CF_CONFIGURED == 'true'
        run: node scripts/build-cloudflare.mjs
      - name: Build GitHub Pages artifact
        if: env.CF_CONFIGURED != 'true'
        run: |
          rm -rf dist
          OUT_DIR=dist SITE_BASE=/Zero-trust/ node scripts/build-pages.mjs
          cp styles.css app.js tool-engine.js account.js account.css manifest.json sw.js 404.html _headers _redirects dist/
          cp -r engines assets dist/
          SITE_BASE=/Zero-trust/ node scripts/merge-legacy-pages.mjs
          OUT_DIR=dist SITE_BASE=/Zero-trust/ node scripts/enhance-platform.mjs
      - name: Verify combined artifact
        run: |
          EXPECTED=$(node --input-type=module -e "import('./data/catalog-combined.mjs').then(({CATALOG})=>process.stdout.write(String(CATALOG.length)))" | tail -n 1)
          test "$(find dist/tools -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -eq "$EXPECTED"
          test "$(find dist/tools/category -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -eq 25
          test -f dist/index.html
          test -f dist/data/tools-index.json
          test -f dist/login/index.html
          test -f dist/owner/index.html
          grep -q 'Quick tools' dist/index.html
          grep -q 'hamburger' dist/index.html
      - name: Prepare Cloudflare Worker + D1 config
        if: env.CF_CONFIGURED == 'true'
        run: |
          set -euo pipefail
          DB_ID="$(npx --yes wrangler@latest d1 list --json | node --input-type=module -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s);const r=a.find(x=>x.name==='zero-trust');process.stdout.write(r?.uuid||r?.database_id||'')})")"
          if [ -z "$DB_ID" ]; then
            DB_ID="$(npx --yes wrangler@latest d1 create zero-trust --json | node --input-type=module -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s);process.stdout.write(x.uuid||x.database_id||'')})")"
          fi
          test -n "$DB_ID"
          cat > /tmp/wrangler-zero-trust.jsonc <<EOF
          {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "zero-trust",
            "main": "api/worker.mjs",
            "compatibility_date": "2026-09-08",
            "assets": { "directory": "./dist", "binding": "ASSETS", "not_found_handling": "404-page" },
            "d1_databases": [{ "binding": "DB", "database_name": "zero-trust", "database_id": "$DB_ID" }],
            "observability": { "enabled": true }
          }
          EOF
          cp /tmp/wrangler-zero-trust.jsonc wrangler.deploy.jsonc
          npx --yes wrangler@latest d1 execute zero-trust --remote --file=api/schema.sql --config=wrangler.deploy.jsonc
      - name: Configure Cloudflare secrets
        if: env.CF_CONFIGURED == 'true' && env.OWNER_EMAIL != '' && env.OWNER_BOOTSTRAP_SECRET != ''
        run: |
          printf '%s' "$OWNER_EMAIL" | npx --yes wrangler@latest secret put OWNER_EMAIL --config=wrangler.deploy.jsonc
          printf '%s' "$OWNER_BOOTSTRAP_SECRET" | npx --yes wrangler@latest secret put OWNER_BOOTSTRAP_SECRET --config=wrangler.deploy.jsonc
      - name: Deploy Cloudflare Worker
        if: env.CF_CONFIGURED == 'true'
        run: npx --yes wrangler@latest deploy --config=wrangler.deploy.jsonc
      - name: Configure GitHub Pages fallback
        if: env.CF_CONFIGURED != 'true'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: env.CF_CONFIGURED != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy GitHub Pages fallback
        if: env.CF_CONFIGURED != 'true'
        uses: actions/deploy-pages@v4

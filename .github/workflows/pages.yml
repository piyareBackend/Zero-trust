name: Deploy Zero Trust
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Normalize physical tool bootstraps
        run: |
          find tools -type f -name index.html -print0 | while IFS= read -r -d '' f; do
            sed -i -E 's#<script src="/Zero-trust/tool-engine\.js\?v=[^"]+" defer></script>#<script src="/Zero-trust/app.js?v=202" defer></script>#g' "$f"
          done
      - name: Protect browser-delivered JavaScript
        run: |
          npx --yes terser@5.44.0 app.js -c -m -o app.js
          npx --yes terser@5.44.0 tool-engine.js -c -m -o tool-engine.js
          for f in engines/free/*.js; do npx --yes terser@5.44.0 "$f" -c -m -o "$f"; done
          find . -name '*.map' -delete
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

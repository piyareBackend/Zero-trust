name: Deploy Zero Trust
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
  pages: write
  id-token: write
concurrency:
  group: zero-trust-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Cloudflare artifact
        if: env.CF_CONFIGURED == 'true'
        run: node scripts/build-cloudflare.mjs
      - name: Build GitHub Pages artifact
        if: env.CF_CONFIGURED != 'true'
        run: |
          rm -rf dist
          OUT_DIR=dist SITE_BASE=/Zero-trust/ node scripts/build-pages.mjs
          cp styles.css app.js tool-engine.js manifest.json sw.js 404.html _headers _redirects dist/
          cp -r engines assets dist/
          SITE_BASE=/Zero-trust/ node scripts/merge-legacy-pages.mjs
      - name: Verify combined artifact
        run: |
          EXPECTED=$(node --input-type=module -e "import('./data/catalog-combined.mjs').then(({CATALOG})=>process.stdout.write(String(CATALOG.length)))" | tail -n 1)
          test "$(find dist/tools -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -eq "$EXPECTED"
          test "$(find dist/tools/category -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -eq 25
          test -f dist/index.html
          test -f dist/data/tools-index.json
          grep -q 'Quick tools' dist/index.html
          grep -q 'hamburger' dist/index.html
      - name: Deploy to Cloudflare Pages
        if: env.CF_CONFIGURED == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=zero-trust --branch=main --commit-message="${{ github.event.head_commit.message }}" --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure GitHub Pages fallback
        if: env.CF_CONFIGURED != 'true'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: env.CF_CONFIGURED != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy GitHub Pages fallback
        if: env.CF_CONFIGURED != 'true'
        uses: actions/deploy-pages@v4

name: Deploy Zero Trust
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
  pages: write
  id-token: write
concurrency:
  group: zero-trust-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://piyarebackend.github.io/Zero-trust/
    env:
      CF_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      OWNER_BOOTSTRAP_SECRET: ${{ secrets.OWNER_BOOTSTRAP_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Normalize generated tool runtimes
        run: |
          set -e
          sed -i 's/getRandomValues(new Uint8Array(3))];/getRandomValues(new Uint8Array(3))]);/g' engines/free/individual-tools.js engines/free/real-tools.js
      - name: Build Cloudflare artifact
        if: env.CF_CONFIGURED == 'true'
        run: node scripts/build-cloudflare.mjs
      - name: Build GitHub Pages artifact
        if: env.CF_CONFIGURED != 'true'
        run: |
          set -e
          rm -rf dist
          OUT_DIR=dist SITE_BASE=/Zero-trust/ node scripts/build-pages.mjs
          cp styles.css tool-page.css app.js tool-engine.js account.js account.css owner.js manifest.json sw.js 404.html _headers _redirects dist/
          cp -r engines assets dist/
          SITE_BASE=/Zero-trust/ node scripts/merge-legacy-pages.mjs
          OUT_DIR=dist SITE_BASE=/Zero-trust/ node scripts/enhance-platform.mjs
          OUT_DIR=dist SITE_BASE=/Zero-trust/ node scripts/optimize-tool-pages.mjs
      - name: Verify combined artifact
        run: |
          EXPECTED=$(node --input-type=module -e "import('./data/catalog-combined.mjs').then(({CATALOG})=>process.stdout.write(String(CATALOG.length)))" | tail -n 1)
          EXPECTED_CATEGORIES=$(node --input-type=module -e "import('./data/catalog.mjs').then(({CATALOG})=>process.stdout.write(String(new Set(CATALOG.map(x=>x.category)).size)))" | tail -n 1)
          test "$(find dist/tools -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -eq "$EXPECTED"
          test "$(find dist/tools/category -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -eq "$EXPECTED_CATEGORIES"
          test -f dist/index.html; test -f dist/data/tools-index.json; test -f dist/tool-page.css; test -f dist/login/index.html; test -f dist/signup/index.html; test -f dist/account/index.html; test -f dist/owner/index.html; test -f dist/pricing/index.html
          grep -q 'Quick tools' dist/index.html; grep -q 'hamburger' dist/index.html; grep -q 'Continue with Google' dist/login/index.html; grep -q '/Zero-trust/tool-page.css' dist/tools/jpg-to-png-converter/index.html
      - name: Prepare Cloudflare Worker + existing production D1
        if: env.CF_CONFIGURED == 'true'
        run: |
          set -euo pipefail
          test -f wrangler.jsonc
          npx --yes wrangler@latest d1 execute zero-trust-production --remote --file=api/schema.sql --config=wrangler.jsonc
      - name: Configure Cloudflare secrets
        if: env.CF_CONFIGURED == 'true'
        run: |
          set -euo pipefail
          if [ -n "$OWNER_EMAIL" ] && [ -n "$OWNER_BOOTSTRAP_SECRET" ]; then printf '%s' "$OWNER_EMAIL" | npx --yes wrangler@latest secret put OWNER_EMAIL --config=wrangler.jsonc; printf '%s' "$OWNER_BOOTSTRAP_SECRET" | npx --yes wrangler@latest secret put OWNER_BOOTSTRAP_SECRET --config=wrangler.jsonc; fi
          if [ -n "$GOOGLE_CLIENT_SECRET" ]; then printf '%s' "$GOOGLE_CLIENT_SECRET" | npx --yes wrangler@latest secret put GOOGLE_CLIENT_SECRET --config=wrangler.jsonc; fi
          if [ -n "$RESEND_API_KEY" ]; then printf '%s' "$RESEND_API_KEY" | npx --yes wrangler@latest secret put RESEND_API_KEY --config=wrangler.jsonc; fi
      - name: Deploy Cloudflare Worker
        if: env.CF_CONFIGURED == 'true'
        run: npx --yes wrangler@latest deploy --config=wrangler.jsonc
      - name: Configure GitHub Pages fallback
        if: env.CF_CONFIGURED != 'true'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: env.CF_CONFIGURED != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy GitHub Pages fallback
        if: env.CF_CONFIGURED != 'true'
        uses: actions/deploy-pages@v4